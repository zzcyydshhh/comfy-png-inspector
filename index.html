<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComfyUI 参数检视台</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a21; --panel2:#1b222b; --line:#262f3a;
    --fg:#e6edf3; --dim:#8b98a9; --dim2:#5f6b7a;
    --acc:#4dd4ac; --acc2:#7aa2ff; --warn:#f0a44e; --bad:#e2646b;
    --mono:"Cascadia Mono","JetBrains Mono",Consolas,"SF Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1200px 700px at 15% -10%,#16202b 0%,var(--bg) 55%);
    color:var(--fg);font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;
  }
  header{
    display:flex;align-items:center;gap:14px;padding:10px 16px;
    background:rgba(21,26,33,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .logo{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.3px}
  .logo i{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:block}
  .stat{color:var(--dim);font-size:12.5px}
  .stat b{color:var(--fg);font-variant-numeric:tabular-nums}
  header .spacer{flex:1}
  button{
    font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:6px 11px;cursor:pointer;transition:.15s;white-space:nowrap;
  }
  button:hover{background:#242e3a;border-color:#33414f}
  button.primary{background:linear-gradient(180deg,#1f6f5c,#17594a);border-color:#2b8a72}
  button.primary:hover{background:linear-gradient(180deg,#248069,#1a6653)}
  button:disabled{opacity:.45;cursor:not-allowed}
  input[type=search],select{
    font:inherit;color:var(--fg);background:#10151b;border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;outline:none;
  }
  input[type=search]:focus,select:focus{border-color:#39606f;box-shadow:0 0 0 3px rgba(77,212,172,.09)}
  main{display:grid;grid-template-columns:340px 1fr;height:calc(100% - 53px)}
  aside{border-right:1px solid var(--line);display:flex;flex-direction:column;background:rgba(21,26,33,.55);min-height:0}
  .aside-top{padding:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
  .row{display:flex;gap:8px}
  .row > *{flex:1;min-width:0}
  #list{overflow:auto;flex:1;padding:6px}
  .item{
    padding:6px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;
    display:flex;align-items:center;gap:9px;
  }
  .item:hover{background:#1a212a}
  .item.sel{background:#1d2a33;border-color:#2f5c58;box-shadow:inset 2px 0 0 var(--acc)}
  .item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .item .mini{
    width:44px;height:44px;flex:none;border-radius:7px;object-fit:cover;
    border:1px solid #2a3540;background:#0b0e12;display:block;
  }
  .item.sel .mini{border-color:#3a7d74}
  .item.bad .mini{opacity:.45}
  .item .n{font-size:13px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .m{font-size:11.5px;color:var(--dim2);display:flex;gap:8px;font-variant-numeric:tabular-nums}
  .item.bad .n{color:var(--warn)}
  .empty{padding:26px 18px;color:var(--dim2);font-size:13px;text-align:center;line-height:1.8}
  section.detail{overflow:auto;padding:18px 22px 60px;min-width:0}
  .drop{
    border:1.5px dashed #2d3b49;border-radius:14px;padding:46px 24px;text-align:center;color:var(--dim);
    background:linear-gradient(180deg,rgba(27,34,43,.5),rgba(21,26,33,.2));transition:.18s;
  }
  .drop.hot{border-color:var(--acc);background:rgba(77,212,172,.07);color:var(--fg)}
  .drop h2{margin:0 0 8px;font-size:17px;font-weight:600;color:var(--fg)}
  .drop p{margin:6px 0;font-size:13px}
  .kbd{font-family:var(--mono);background:#10151b;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px}
  .hdr{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
  .thumb-wrap{position:relative;flex:none}
  .thumb{
    width:212px;max-height:288px;height:auto;border-radius:10px;border:1px solid #33414f;display:block;
    background:#0b0e12;object-fit:contain;cursor:zoom-in;transition:.16s;
    box-shadow:0 6px 18px rgba(0,0,0,.45);
  }
  .thumb:hover{border-color:var(--acc);box-shadow:0 8px 26px rgba(0,0,0,.6)}
  .thumb-wrap .zoomhint{
    position:absolute;right:8px;bottom:8px;font-size:11px;color:#cfe6df;background:rgba(10,14,18,.72);
    border:1px solid #2f5c58;border-radius:6px;padding:1px 7px;pointer-events:none;opacity:0;transition:.16s;
  }
  .thumb-wrap:hover .zoomhint{opacity:1}
  #lightbox{
    position:fixed;inset:0;background:rgba(6,9,12,.93);display:none;z-index:80;
    padding:28px;cursor:zoom-out;
  }
  #lightbox.on{display:flex;align-items:center;justify-content:center}
  #lightbox img{max-width:100%;max-height:calc(100vh - 56px);border-radius:10px;
    box-shadow:0 18px 60px rgba(0,0,0,.7);border:1px solid #2b3742}
  #lightbox .cap{position:absolute;top:14px;left:20px;right:20px;color:#cfd9e4;font-size:12.5px;
    font-family:var(--mono);opacity:.85;pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hdr h1{font-size:17px;margin:0 0 4px;font-weight:600;word-break:break-all}
  .wftools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 6px}
  .wftools .hint{color:var(--dim2);font-size:12px}
  .rep{
    background:#141a21;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0 4px;
    font-family:var(--mono);font-size:12px;line-height:1.6;max-height:230px;overflow:auto;color:#c8d3de;
  }
  .rep .ok{color:var(--acc)}
  .rep .wn{color:var(--warn)}
  .rep .t{color:var(--dim);margin-bottom:4px;font-family:inherit}
  .sub{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:14px 0 18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .card .k{font-size:11.5px;color:var(--dim2);letter-spacing:.4px;text-transform:uppercase}
  .card .v{font-family:var(--mono);font-size:13.5px;margin-top:3px;word-break:break-all;color:var(--fg)}
  h3.sec{font-size:12.5px;letter-spacing:.6px;color:var(--dim);text-transform:uppercase;margin:22px 0 10px;
    display:flex;align-items:center;gap:9px}
  h3.sec::after{content:"";flex:1;height:1px;background:var(--line)}
  h3.sec .cnt{color:var(--dim2);font-weight:400}
  .lora{display:grid;grid-template-columns:26px 1fr 78px 150px;align-items:center;gap:10px;padding:4px 0;
    font-size:13px;border-bottom:1px solid rgba(38,47,58,.5)}
  .lora .idx{color:var(--dim2);font-family:var(--mono);font-size:11.5px;text-align:right}
  .lora .nm{font-family:var(--mono);font-size:12.5px;color:#cfd9e4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lora .nm .dir{color:var(--dim2)}
  .lora .val{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
  .track{position:relative;height:8px;background:#0d1116;border:1px solid #202932;border-radius:6px;overflow:hidden}
  .track .zero{position:absolute;top:0;bottom:0;width:1px;background:#39434f}
  .track .fill{position:absolute;top:0;bottom:0;border-radius:4px}
  .fill.pos{background:linear-gradient(90deg,rgba(77,212,172,.35),var(--acc))}
  .fill.neg{background:linear-gradient(270deg,rgba(226,100,107,.35),var(--bad))}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#1a212a;border:1px solid var(--line);
    border-radius:999px;padding:3px 10px;font-size:12px;margin:0 6px 6px 0;font-family:var(--mono)}
  .chip.by{color:var(--warn);border-color:#4a3a24;background:#241d14}
  .prompt{
    position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 44px 12px 13px;
  }
  .prompt pre{
    margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12.5px;
    line-height:1.65;color:#d5dee7;max-height:340px;overflow:auto;
  }
  .prompt pre.clip{max-height:96px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent)}
  .prompt .tools{position:absolute;top:8px;right:8px;display:flex;gap:6px}
  .iconbtn{background:#1e2732;border:1px solid var(--line);border-radius:7px;width:28px;height:28px;
    display:grid;place-items:center;cursor:pointer;color:var(--dim);font-size:13px}
  .iconbtn:hover{color:var(--fg);border-color:#3a4757}
  .meta-line{color:var(--dim2);font-size:11.5px;font-family:var(--mono);margin:6px 0 0}
  table.sum{width:100%;border-collapse:collapse;font-size:12.5px;font-family:var(--mono)}
  table.sum th,table.sum td{padding:6px 8px;text-align:left;border-bottom:1px solid rgba(38,47,58,.6);white-space:nowrap}
  table.sum th{position:sticky;top:0;background:#141a21;color:var(--dim);font-weight:500;cursor:pointer;z-index:1}
  table.sum tbody tr{cursor:pointer}
  table.sum tbody tr:hover{background:#1a212a}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);
    background:#1d2a33;border:1px solid #2f5c58;color:var(--fg);padding:9px 16px;border-radius:9px;
    opacity:0;transition:.22s;pointer-events:none;font-size:13px;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .bar-progress{height:3px;background:#0d1116;position:relative;overflow:hidden}
  .bar-progress i{position:absolute;inset:0 100% 0 0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:right .2s}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#28323d;border-radius:6px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#36434f;background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}
  @media (max-width:820px){
    main{grid-template-columns:1fr;grid-template-rows:38% 1fr}
    aside{border-right:none;border-bottom:1px solid var(--line)}
  }
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>ComfyUI 参数检视台</div>
  <div class="stat" id="stat">未载入图片</div>
  <div class="spacer"></div>
  <button id="btnFiles" class="primary">选择图片</button>
  <button id="btnDir">选择文件夹</button>
  <button id="btnTpl" title="载入一份画布工作流 JSON 当模板；只读深拷贝，绝不改动它">载入模板</button>
  <span id="tplName" class="stat" style="max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
  <select id="sortSel" title="排序">
    <option value="mtime-desc">时间 ↓</option>
    <option value="mtime-asc">时间 ↑</option>
    <option value="name-asc">文件名 ↑</option>
    <option value="seed">种子</option>
  </select>
  <button id="btnCsv">导出 CSV</button>
  <button id="btnJson">导出参数 JSON</button>
  <button id="btnZip" title="把筛选结果的画布工作流打包成 zip">导出工作流 ZIP</button>
  <button id="btnClear">清空</button>
</header>
<div class="bar-progress"><i id="prog"></i></div>
<main>
  <aside>
    <div class="aside-top">
      <input type="search" id="search" placeholder="搜文件名 / LoRA 名 / 提示词（Ctrl+K）">
      <div class="row">
        <select id="viewSel">
          <option value="detail">详情视图</option>
          <option value="sum">汇总表</option>
        </select>
        <button id="btnOnlyBy" title="只列出存在 bypass 节点的图">含旁路</button>
      </div>
    </div>
    <div id="list"></div>
  </aside>
  <section class="detail" id="detail"></section>
</main>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="image/png" multiple hidden>
<input type="file" id="dirInput" webkitdirectory directory multiple hidden>
<input type="file" id="tplInput" accept=".json,application/json" hidden>

<div id="lightbox"><div class="cap"></div><img alt=""></div>

<script src="comfy-png-core.js"></script>
<script>
(function () {
  "use strict";

  var state = {
    items: [],          // {id, name, rec, file, url}
    filtered: [],
    selected: null,
    onlyBypass: false,
    sort: "mtime-desc",
    view: "detail",
    busy: 0,
    template: null
  };
  var uid = 0;

  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, txt) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (txt !== undefined) d.textContent = txt;
    return d;
  };
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove("show"); }, 2000);
  }
  function fmtTime(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    var p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "/" + p(d.getMonth() + 1) + "/" + p(d.getDate()) + " " +
           p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  function fmtNum(v, nd) {
    if (v === undefined || v === null || v === "") return "—";
    if (typeof v === "number") return Number.isInteger(v) ? String(v) : v.toFixed(nd === undefined ? 2 : nd);
    return String(v);
  }

  /* ------------------------------ 载入 ------------------------------ */
  function addFiles(fileList) {
    var files = Array.prototype.slice.call(fileList).filter(function (f) {
      return /\.png$/i.test(f.name);
    });
    if (!files.length) { toast("只认得 .png（ComfyUI 元数据只写在 PNG 里）"); return; }
    var queue = files.slice(), total = queue.length, done = 0;
    var CONC = 6;

    function tick() {
      done++;
      $("prog").style.right = (100 - (done / total) * 100) + "%";
      $("stat").textContent = "解析中 " + done + "/" + total;
      if (done === total) {
        setTimeout(function () { $("prog").style.right = "100%"; updateStat(); }, 260);
        applyFilter();
        if (!state.selected && state.filtered.length) select(state.filtered[0].id);
      }
    }
    function next() {
      var f = queue.shift();
      if (!f) return Promise.resolve();
      return f.arrayBuffer().then(function (buf) {
        return ComfyPNG.parsePng(new Uint8Array(buf), {
          name: f.name,
          path: f.webkitRelativePath || f.name,
          size: f.size,
          mtime: f.lastModified
        });
      }).then(function (rec) {
        var item = { id: ++uid, name: f.name, rec: rec, file: f, url: URL.createObjectURL(f) };
        state.items.push(item);
        tick();
      }).catch(function (e) {
        state.items.push({ id: ++uid, name: f.name, rec: { name: f.name, error: String(e && e.message || e) },
                           file: f, url: URL.createObjectURL(f) });
        tick();
      }).then(next);
    }
    var lanes = [];
    for (var i = 0; i < Math.min(CONC, total); i++) lanes.push(next());
    Promise.all(lanes).then(function () { toast("载入 " + total + " 张"); });
  }

  async function addFromDrop(dt) {
    var items = Array.prototype.slice.call(dt.items || []);
    var entries = items.map(function (it) { return it.webkitGetAsEntry && it.webkitGetAsEntry(); }).filter(Boolean);
    if (!entries.length) { addFiles(dt.files); return; }
    var files = [];
    async function walk(entry) {
      if (entry.isFile) {
        await new Promise(function (res) {
          entry.file(function (f) { files.push(f); res(); }, function () { res(); });
        });
      } else if (entry.isDirectory) {
        var reader = entry.createReader();
        var batch;
        do {
          batch = await new Promise(function (res) { reader.readEntries(res, function () { res([]); }); });
          for (var i = 0; i < batch.length; i++) await walk(batch[i]);
        } while (batch.length);
      }
    }
    for (var i = 0; i < entries.length; i++) await walk(entries[i]);
    addFiles(files);
  }

  /* ------------------------------ 列表 ------------------------------ */
  function applyFilter() {
    var q = $("search").value.trim().toLowerCase();
    var arr = state.items.slice();
    if ($("viewSel").value === "sum") state.view = "sum"; else state.view = "detail";
    state.onlyBypass = $("btnOnlyBy").classList.contains("on");
    if (state.onlyBypass) {
      arr = arr.filter(function (it) { return it.rec.workflow && it.rec.workflow.bypassed.length; });
    }
    if (q) {
      arr = arr.filter(function (it) {
        var r = it.rec;
        if ((r.name || "").toLowerCase().indexOf(q) >= 0) return true;
        if ((r.positive || "").toLowerCase().indexOf(q) >= 0) return true;
        if ((r.negative || "").toLowerCase().indexOf(q) >= 0) return true;
        return (r.loras || []).some(function (l) { return String(l.name).toLowerCase().indexOf(q) >= 0; });
      });
    }
    var s = $("sortSel").value;
    arr.sort(function (a, b) {
      if (s === "mtime-asc") return (a.rec.mtime || 0) - (b.rec.mtime || 0);
      if (s === "name-asc") return a.name.localeCompare(b.name);
      if (s === "seed") return Number(b.rec.seed || 0) - Number(a.rec.seed || 0);
      return (b.rec.mtime || 0) - (a.rec.mtime || 0);
    });
    state.filtered = arr;
    renderList();
    if (state.view === "sum") renderDetail();
    else if (state.selected && !arr.some(function (x) { return x.id === state.selected; })) {
      state.selected = arr.length ? arr[0].id : null;
      renderDetail();
    }
  }

  function renderList() {
    var box = $("list");
    box.innerHTML = "";
    if (!state.filtered.length) {
      var d = el("div", "empty");
      d.innerHTML = state.items.length
        ? "没有匹配的图片<br>清空搜索条件试试"
        : "把 ComfyUI 的 output 文件夹<br>拖进来，或点右上角选择";
      box.appendChild(d);
      return;
    }
    var frag = document.createDocumentFragment();
    state.filtered.forEach(function (it) {
      var r = it.rec;
      var row = el("div", "item" + (it.id === state.selected ? " sel" : "") + (r.error ? " bad" : ""));
      var body = el("div", "body");
      body.appendChild(el("div", "n", it.name));
      var m = el("div", "m");
      m.appendChild(el("span", null, r.error ? "无元数据" : r.pngSize + "px"));
      if (!r.error) {
        m.appendChild(el("span", null, (r.loras ? r.loras.length : 0) + " LoRA"));
        m.appendChild(el("span", null, "s" + fmtNum(r.steps)));
      }
      m.appendChild(el("span", null, fmtTime(r.mtime).slice(5)));
      body.appendChild(m);
      row.appendChild(body);
      var mini = new Image();
      mini.className = "mini";
      mini.loading = "lazy";
      mini.decoding = "async";
      mini.alt = "";
      mini.src = it.url;
      row.appendChild(mini);
      row.onclick = function () { select(it.id); };
      frag.appendChild(row);
    });
    box.appendChild(frag);
  }

  function select(id) {
    state.selected = id;
    if (state.view === "sum") { $("viewSel").value = "detail"; state.view = "detail"; }
    renderList();
    renderDetail();
    var sel = $("list").querySelector(".item.sel");
    if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: "nearest" });
  }

  /* ------------------------------ 详情 ------------------------------ */
  function card(k, v, mono) {
    var d = el("div", "card");
    d.appendChild(el("div", "k", k));
    var val = el("div", "v", v);
    if (mono === false) val.style.fontFamily = "inherit";
    d.appendChild(val);
    return d;
  }

  function loraRow(i, l, maxAbs) {
    var row = el("div", "lora");
    row.appendChild(el("div", "idx", String(i)));
    var nm = el("div", "nm");
    var parts = String(l.name).split("\\");
    if (parts.length > 1) {
      nm.appendChild(el("span", "dir", parts.slice(0, -1).join("\\") + "\\"));
      nm.appendChild(el("span", null, parts[parts.length - 1]));
    } else nm.textContent = l.name;
    nm.title = l.name;
    row.appendChild(nm);
    var v = Number(l.strength);
    var val = el("div", "val", isNaN(v) ? fmtNum(l.strength) : v.toFixed(2));
    if (!isNaN(v)) val.style.color = v > 0 ? "var(--acc)" : (v < 0 ? "var(--bad)" : "var(--dim)");
    row.appendChild(val);

    var track = el("div", "track");
    if (!isNaN(v)) {
      var scale = maxAbs || 1;
      var zeroPct = 50;
      var posPct = 50 + (v / scale) * 50;
      var z = el("div", "zero"); z.style.left = zeroPct + "%"; track.appendChild(z);
      var f = el("div", "fill " + (v >= 0 ? "pos" : "neg"));
      if (v >= 0) { f.style.left = zeroPct + "%"; f.style.width = (posPct - zeroPct) + "%"; }
      else { f.style.left = posPct + "%"; f.style.width = (zeroPct - posPct) + "%"; }
      track.appendChild(f);
    }
    row.appendChild(track);
    return row;
  }

  function promptBlock(title, text, src, generated, note) {
    var wrap = el("div", "prompt");
    var pre = el("pre");
    if (generated) {
      pre.textContent = "（运行时生成 — 该节点的输出由它自己的输入算出来，PNG 里没有存这份文本）";
      pre.style.color = "var(--dim2)";
    } else {
      pre.textContent = text || "（空）";
      if (!text) pre.style.color = "var(--dim2)";
    }
    if ((text || "").length > 420) pre.classList.add("clip");
    wrap.appendChild(pre);

    var tools = el("div", "tools");
    if ((text || "").length > 420) {
      var tg = el("div", "iconbtn", "⌄"); tg.title = "展开/收起";
      tg.onclick = function () {
        pre.classList.toggle("clip");
        tg.textContent = pre.classList.contains("clip") ? "⌄" : "⌃";
      };
      tools.appendChild(tg);
    }
    var cp = el("div", "iconbtn", "⧉"); cp.title = "复制";
    cp.onclick = function () { copy(text || ""); };
    tools.appendChild(cp);
    wrap.appendChild(tools);
    var ml = el("div", "meta-line", (src || "") + (text ? "  ·  " + text.length + " 字" : "") + (note ? "  ·  " + note : ""));
    wrap.appendChild(ml);
    return wrap;
  }

  function openLightbox(url, caption) {
    var lb = $("lightbox");
    lb.querySelector("img").src = url;
    lb.querySelector(".cap").textContent = caption || "";
    lb.classList.add("on");
  }
  function closeLightbox() { $("lightbox").classList.remove("on"); }

  function copy(text) {    var done = function () { toast("已复制 " + text.length + " 字"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else fallback();
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { toast("复制失败"); }
      document.body.removeChild(ta);
    }
  }

  function renderDetail() {
    var box = $("detail");
    box.innerHTML = "";

    if (state.view === "sum") { renderSum(box); return; }

    var item = state.items.filter(function (x) { return x.id === state.selected; })[0];
    if (!item) {
      var d = el("div", "drop");
      d.innerHTML = '<h2>拖入 ComfyUI 生成的 PNG</h2>' +
        '<p>整张图拖进来，或拖入 <span class="kbd">output</span> 文件夹——会递归读全部 .png</p>' +
        '<p style="color:var(--dim2)">元数据在 PNG 的 tEXt 块里，不走网络，不上传，全部在本机浏览器里完成</p>' +
        '<p style="margin-top:16px"><span class="kbd">Ctrl</span> + <span class="kbd">K</span> 搜索 &nbsp;·&nbsp; ' +
        '<span class="kbd">↑</span><span class="kbd">↓</span> 切换图片</p>';
      box.appendChild(d);
      return;
    }

    var r = item.rec;
    var hdr = el("div", "hdr");
    var tw = el("div", "thumb-wrap");
    var img = new Image();
    img.className = "thumb"; img.src = item.url; img.loading = "lazy";
    img.alt = item.name;
    img.onclick = function () { openLightbox(item.url, item.name + "  ·  " + (r.pngSize || "") + " px"); };
    tw.appendChild(img);
    tw.appendChild(el("span", "zoomhint", "点击放大"));
    hdr.appendChild(tw);
    var info = el("div");
    info.appendChild(el("h1", null, item.name));
    info.appendChild(el("div", "sub", fmtTime(r.mtime) + "  ·  " + (r.pngSize || "") + " px  ·  " +
      (r.size ? (r.size / 1024).toFixed(0) + " KB" : "")));
    if (r.error) {
      info.appendChild(el("div", "psub", ""));
      var e = el("div", "sub", "⚠ " + r.error); e.style.color = "var(--warn)"; e.style.marginTop = "8px";
      info.appendChild(e);
    }
    hdr.appendChild(info);
    box.appendChild(hdr);

    if (!r.error) {
      var tools = el("div", "wftools");
      var b1 = el("button", "primary", r._workflow ? "导出这张图的工作流 JSON" : "用模板重建并导出");
      b1.onclick = function () { exportWorkflow(item); };
      tools.appendChild(b1);
      if (r._workflow) {
        var b2 = el("button", null, "用模板重建（对照当前模板）");
        b2.onclick = function () { composeExport(item); };
        tools.appendChild(b2);
      }
      tools.appendChild(el("span", "hint", r._workflow
        ? "原样导出＝执行那一刻的画布：节点位置、连线、旁路状态、控件值都与出图时一致"
        : "这张图只存了 API 图，用模板补出画布才能导入 ComfyUI"));
      box.appendChild(tools);
      var slot = el("div");
      slot.id = "repSlot";
      box.appendChild(slot);
    }

    if (r.error && r.a1111) {
      box.appendChild(promptBlock("A1111", r.a1111, "parameters 块", false));
      return;
    }
    if (r.error) return;

    var cards = el("div", "cards");
    cards.appendChild(card("种子", fmtNum(r.seed)));
    cards.appendChild(card("步数", fmtNum(r.steps)));
    cards.appendChild(card("CFG", fmtNum(r.cfg)));
    cards.appendChild(card("采样器", (r.sampler || "—") + " / " + (r.scheduler || "—")));
    cards.appendChild(card("降噪", fmtNum(r.denoise)));
    cards.appendChild(card("latent", r.latent || "—"));
    cards.appendChild(card("底模", r.baseModel || "—"));
    cards.appendChild(card("CLIP", r.clip || "—"));
    cards.appendChild(card("VAE", r.vae || "—"));
    cards.appendChild(card("保存前缀", r.prefix || "—"));
    box.appendChild(cards);

    // 采样前 patch
    if (r.patches && r.patches.length) {
      box.appendChild(secTitle("采样前调节", String(r.patches.length)));
      r.patches.forEach(function (p) {
        var kv = Object.keys(p.params || {}).map(function (k) { return k + "=" + p.params[k]; }).join("  ");
        var chip = el("span", "chip", p.class_type + "#" + p.id + "  " + kv);
        box.appendChild(chip);
      });
    }

    // LoRA 链
    var loras = r.loras || [];
    box.appendChild(secTitle("LoRA 执行链", loras.length + " 个"));
    if (loras.length) {
      var maxAbs = Math.max.apply(null, loras.map(function (l) { return Math.abs(Number(l.strength) || 0); }));
      maxAbs = Math.max(maxAbs, 1);
      var wrap = el("div");
      loras.forEach(function (l, i) { wrap.appendChild(loraRow(i + 1, l, maxAbs)); });
      box.appendChild(wrap);
      var cpbar = el("div");
      cpbar.style.marginTop = "10px";
      var b = el("button", null, "复制整条链");
      b.onclick = function () {
        copy(loras.map(function (l) { return l.name + ":" + Number(l.strength).toFixed(2); }).join("\n"));
      };
      cpbar.appendChild(b);
      box.appendChild(cpbar);
    } else {
      box.appendChild(el("div", "meta-line", "（这张图没有 LoRA）"));
    }

    // 旁路
    if (r.workflow && (r.workflow.bypassed.length || r.workflow.muted.length)) {
      box.appendChild(secTitle("未参与出图", String(r.workflow.bypassed.length + r.workflow.muted.length)));
      var chips = el("div");
      r.workflow.bypassed.forEach(function (x) {
        chips.appendChild(el("span", "chip by", "bypass #" + x.id + " " + x.type));
      });
      r.workflow.muted.forEach(function (x) {
        chips.appendChild(el("span", "chip by", "mute #" + x.id + " " + x.type));
      });
      box.appendChild(chips);
      box.appendChild(el("div", "meta-line", "画布上摆着 ≠ 参与执行；这些节点在执行图里根本不存在"));
    }

    // 提示词
    box.appendChild(secTitle("正向提示词", r.positive && !r.positiveGenerated ? r.positive.length + " 字" : ""));
    box.appendChild(promptBlock("正向", r.positive, r.positiveSrc, r.positiveGenerated));
    box.appendChild(secTitle("反向提示词", r.negative && !r.negativeGenerated ? r.negative.length + " 字" : ""));
    box.appendChild(promptBlock("反向", r.negative, r.negativeSrc, r.negativeGenerated));

    // 备注 Note
    if (r.workflow && r.workflow.notes.length) {
      box.appendChild(secTitle("画布备注", String(r.workflow.notes.length)));
      r.workflow.notes.forEach(function (n) { box.appendChild(promptBlock("note", n.text, "Note#" + n.id, false)); });
    }

    box.appendChild(el("div", "meta-line", "元数据块：" + (r.metaKeys || []).join(", ") +
      "  ·  执行图 " + (r.nodeCount || 0) + " 节点  ·  画布 " + ((r.workflow && r.workflow.nodeCount) || 0) + " 节点"));
  }

  function secTitle(text, cnt) {
    var h = el("h3", "sec", text);
    if (cnt) h.appendChild(el("span", "cnt", cnt));
    return h;
  }

  /* ------------------------------ 汇总表 ------------------------------ */
  function renderSum(box) {
    var arr = state.filtered;
    if (!arr.length) { box.appendChild(el("div", "empty", "没有数据")); return; }
    var h = el("h3", "sec", "汇总"); h.appendChild(el("span", "cnt", arr.length + " 张"));
    box.appendChild(h);

    var table = el("table", "sum");
    var thead = el("thead"), tr = el("tr");
    ["文件名", "时间", "尺寸", "步数", "CFG", "LoRA", "种子", "底模"].forEach(function (t) {
      tr.appendChild(el("th", null, t));
    });
    thead.appendChild(tr); table.appendChild(thead);
    var tb = el("tbody");
    arr.forEach(function (it) {
      var r = it.rec, row = el("tr");
      [it.name, fmtTime(r.mtime), r.pngSize || "", fmtNum(r.steps), fmtNum(r.cfg),
       String((r.loras || []).length), fmtNum(r.seed), r.baseModel || ""].forEach(function (v) {
        var td = el("td", null, v); row.appendChild(td);
      });
      row.onclick = function () { select(it.id); };
      tb.appendChild(row);
    });
    table.appendChild(tb);
    box.appendChild(table);
  }

  /* ------------------------------ 导出 ------------------------------ */
  function csvCell(v) {
    var s = v === undefined || v === null ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function download(name, text, mime) {
    var blob = new Blob([text], { type: (mime || "text/plain") + ";charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }
  function downloadBytes(name, u8, mime) {
    var blob = new Blob([u8], { type: mime || "application/octet-stream" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 8000);
  }

  /* ------------------------ 工作流导出 / 模板重建 ------------------------ */
  function baseName(n) { return n.replace(/\.png$/i, ""); }

  function exportWorkflow(item) {
    var r = item.rec;
    if (r._workflow) {
      download(baseName(item.name) + ".workflow.json",
               JSON.stringify(r._workflow, null, 2), "application/json");
      toast("已导出原样工作流（画布 JSON）");
      return;
    }
    if (state.template) { composeExport(item); return; }
    toast("这张图没有画布工作流块，先「载入模板」重建");
  }

  function composeExport(item, silent) {
    if (!state.template) { toast("先点右上「载入模板」选一份画布工作流 JSON"); return null; }
    var out;
    try {
      out = ComfyPNG.composeWorkflow(state.template.json, item.rec);
    } catch (e) {
      toast("重建失败：" + (e && e.message || e));
      return null;
    }
    if (!silent) {
      download(baseName(item.name) + ".rebuilt.json",
               JSON.stringify(out.workflow, null, 2), "application/json");
      toast("已按模板重建并导出（" + out.report.length + " 项变更）");
    }
    showReport(out, item);
    return out;
  }

  function showReport(out, item) {
    var slot = document.getElementById("repSlot");
    if (!slot) return;
    slot.innerHTML = "";
    var box = el("div", "rep");
    var head = el("div", "t", "重建报告 · 模板 " + state.template.name +
      "（深拷贝，原文件未改动）· " + out.report.length + " 项变更");
    box.appendChild(head);
    out.report.slice(0, 40).forEach(function (line) {
      box.appendChild(el("div", "ok", "· " + line));
    });
    if (out.report.length > 40) box.appendChild(el("div", "", "… 另有 " + (out.report.length - 40) + " 项"));
    out.warnings.forEach(function (w) { box.appendChild(el("div", "wn", "⚠ " + w)); });
    if (!out.warnings.length) box.appendChild(el("div", "ok", "自检通过：无悬空连线、KSampler 接线完整"));
    slot.appendChild(box);
  }

  function exportZip() {
    var list = state.filtered.filter(function (it) { return it.rec._workflow; });
    if (!list.length) { toast("当前筛选结果里没有带画布工作流的图"); return; }
    var enc = new TextEncoder();
    var entries = list.map(function (it) {
      return { name: baseName(it.name) + ".workflow.json",
               data: enc.encode(JSON.stringify(it.rec._workflow, null, 2)) };
    });
    var zip = ComfyPNG.zipStore(entries);
    downloadBytes("comfy_workflows_" + Date.now() + ".zip", zip, "application/zip");
    toast("已打包 " + entries.length + " 份工作流（" + (zip.length / 1024 / 1024).toFixed(1) + " MB）");
  }

  function loadTemplate(file) {
    file.text().then(function (txt) {
      var json;
      try { json = JSON.parse(txt); } catch (e) { toast("模板不是合法 JSON"); return; }
      if (!json || !Array.isArray(json.nodes)) {
        toast("这不是画布工作流（缺 nodes 数组）——API 格式的 prompt JSON 当不了模板");
        return;
      }
      state.template = { name: file.name, json: json, nodes: json.nodes.length };
      var t = $("tplName");
      t.textContent = "模板：" + file.name + "（" + json.nodes.length + " 节点 · 只读）";
      t.title = "只在内存里深拷贝，导出为新文件，不会改动原文件";
      t.style.color = "var(--acc)";
      toast("模板已载入：" + file.name);
      renderDetail();
    });
  }
  function exportCsv() {
    if (!state.filtered.length) { toast("没有数据"); return; }
    var cols = ["name", "mtime", "pngSize", "seed", "steps", "cfg", "sampler", "scheduler", "denoise",
                "width", "height", "baseModel", "clip", "vae", "prefix", "loraCount", "loras", "positive", "negative"];
    var lines = [cols.join(",")];
    state.filtered.forEach(function (it) {
      var r = it.rec;
      var row = {
        name: it.name, mtime: fmtTime(r.mtime), pngSize: r.pngSize, seed: r.seed, steps: r.steps,
        cfg: r.cfg, sampler: r.sampler, scheduler: r.scheduler, denoise: r.denoise,
        width: r.width, height: r.height, baseModel: r.baseModel, clip: r.clip, vae: r.vae,
        prefix: r.prefix, loraCount: (r.loras || []).length,
        loras: (r.loras || []).map(function (l) { return l.name + "=" + Number(l.strength).toFixed(2); }).join("; "),
        positive: r.positive, negative: r.negative
      };
      lines.push(cols.map(function (c) { return csvCell(row[c]); }).join(","));
    });
    download("comfy_params_" + Date.now() + ".csv", "\ufeff" + lines.join("\r\n"), "text/csv");
    toast("已导出 " + state.filtered.length + " 行");
  }
  function exportJson() {
    if (!state.filtered.length) { toast("没有数据"); return; }
    var out = state.filtered.map(function (it) {
      var r = JSON.parse(JSON.stringify(it.rec));
      delete r._prompt; delete r._workflow;
      r.file = it.rec.path || it.name;
      return r;
    });
    download("comfy_params_" + Date.now() + ".json", JSON.stringify(out, null, 2), "application/json");
    toast("已导出 " + out.length + " 条");
  }

  function updateStat() {
    var n = state.items.length;
    var withMeta = state.items.filter(function (x) { return !x.rec.error; }).length;
    $("stat").textContent = n ? (n + " 张 · " + withMeta + " 张有元数据") : "未载入图片";
  }

  /* ------------------------------ 事件 ------------------------------ */
  $("btnFiles").onclick = function () { $("fileInput").click(); };
  $("btnDir").onclick = function () { $("dirInput").click(); };
  $("fileInput").onchange = function (e) { addFiles(e.target.files); e.target.value = ""; };
  $("dirInput").onchange = function (e) { addFiles(e.target.files); e.target.value = ""; };
  $("search").oninput = function () { applyFilter(); };
  $("sortSel").onchange = function () { applyFilter(); };
  $("viewSel").onchange = function () { applyFilter(); renderDetail(); };
  $("btnOnlyBy").onclick = function () {
    this.classList.toggle("on");
    this.style.borderColor = this.classList.contains("on") ? "var(--acc)" : "";
    this.style.color = this.classList.contains("on") ? "var(--acc)" : "";
    applyFilter();
  };
  $("btnCsv").onclick = exportCsv;
  $("btnJson").onclick = exportJson;
  $("btnTpl").onclick = function () { $("tplInput").click(); };
  $("tplInput").onchange = function (e) {
    if (e.target.files && e.target.files[0]) loadTemplate(e.target.files[0]);
    e.target.value = "";
  };
  $("btnZip").onclick = exportZip;
  $("lightbox").onclick = closeLightbox;
  $("btnClear").onclick = function () {
    state.items.forEach(function (it) { try { URL.revokeObjectURL(it.url); } catch (e) {} });
    state.items = []; state.filtered = []; state.selected = null;
    renderList(); renderDetail(); updateStat();
    toast("已清空");
  };

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeLightbox(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("search").focus(); return; }
    if (document.activeElement && /input|select|textarea/i.test(document.activeElement.tagName)) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!state.filtered.length) return;
      e.preventDefault();
      var idx = state.filtered.findIndex(function (x) { return x.id === state.selected; });
      var next = e.key === "ArrowDown" ? idx + 1 : idx - 1;
      next = Math.max(0, Math.min(state.filtered.length - 1, next));
      select(state.filtered[next].id);
    }
  });

  // 拖放
  var dz = $("detail");
  ["dragenter", "dragover"].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add("hot"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      if (ev === "drop") e.preventDefault();
      if (ev === "dragleave" && e.relatedTarget) return;
      dz.classList.remove("hot");
    });
  });
  document.addEventListener("drop", function (e) {
    e.preventDefault();
    if (e.dataTransfer) addFromDrop(e.dataTransfer);
  });

  renderList();
  renderDetail();
})();
</script>
</body>
</html>
