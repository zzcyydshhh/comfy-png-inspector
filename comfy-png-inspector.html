<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Read ComfyUI PNG metadata: LoRA chain with strengths, sampler settings, prompts — and export the workflow that made the image.">
<title>ComfyUI 参数检视台</title>
<style>
  /* ============================ design tokens ============================ */
  :root{
    --bg-0:#070a0e;
    --bg-1:#0b0f15;
    --bg-2:#10161e;
    --bg-3:#151d26;
    --bg-4:#1b2530;
    --line:rgba(255,255,255,.065);
    --line-2:rgba(255,255,255,.11);
    --line-3:rgba(255,255,255,.18);
    --fg:#e9eff6;
    --fg-2:#a8b5c4;
    --fg-3:#71808f;
    --acc:#4ade9f;
    --acc-deep:#1f9d74;
    --blue:#83a9ff;
    --warn:#f4b95e;
    --bad:#f0787f;
    --r-xs:6px; --r-sm:9px; --r-md:12px; --r-lg:16px;
    --mono:"Cascadia Mono","JetBrains Mono",ui-monospace,Consolas,"SF Mono",monospace;
    --sans:-apple-system,"Segoe UI Variable Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--fg);font:14px/1.55 var(--sans);background:var(--bg-0);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(900px 520px at 8% -12%, rgba(74,222,159,.10), transparent 60%),
      radial-gradient(760px 460px at 100% -6%, rgba(131,169,255,.10), transparent 58%),
      radial-gradient(1200px 700px at 50% 120%, rgba(35,60,72,.30), transparent 70%);
  }
  body.drag::after{
    content:"";position:fixed;inset:12px;border:1.5px dashed rgba(74,222,159,.55);border-radius:20px;
    pointer-events:none;z-index:100;background:rgba(74,222,159,.04);
  }
  button,input,select{font:inherit;color:inherit}
  ::selection{background:rgba(74,222,159,.25)}

  /* ============================ shell ============================ */
  .app{position:relative;z-index:1;display:grid;grid-template-rows:auto auto 1fr;height:100%}

  .topbar{
    display:flex;align-items:center;gap:12px;padding:10px 18px;
    border-bottom:1px solid var(--line);background:rgba(11,15,21,.72);
    backdrop-filter:blur(14px) saturate(1.2);
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand-mark{
    width:24px;height:24px;border-radius:8px;flex:none;display:grid;place-items:center;
    font-size:8.5px;font-weight:800;letter-spacing:.2px;color:#04120c;
    background:linear-gradient(150deg,var(--acc),var(--acc-deep) 58%,#1d6f9a);
    box-shadow:0 0 0 1px rgba(255,255,255,.10), 0 6px 16px rgba(74,222,159,.26);
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.18;min-width:0}
  .brand-name{font-size:13.5px;font-weight:600;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-sub{font-size:10px;color:var(--fg-3);letter-spacing:.8px;text-transform:uppercase}
  .topbar .spacer{flex:1}

  .lang{display:inline-flex;padding:2px;gap:2px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
  .lang button{
    border:0;background:transparent;color:var(--fg-3);cursor:pointer;padding:4px 10px;border-radius:999px;
    font-size:11.5px;letter-spacing:.4px;transition:.16s;
  }
  .lang button:hover{color:var(--fg-2)}
  .lang button.on{background:rgba(74,222,159,.14);color:var(--acc);box-shadow:inset 0 0 0 1px rgba(74,222,159,.28)}

  .btn{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);
    background:rgba(255,255,255,.035);color:var(--fg);padding:7px 12px;border-radius:var(--r-sm);
    cursor:pointer;font-size:12.5px;transition:.15s;white-space:nowrap;
  }
  .btn:hover{background:rgba(255,255,255,.075);border-color:var(--line-3)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{
    background:linear-gradient(180deg,#37d597,#1f9d74);border-color:rgba(255,255,255,.16);
    color:#04150e;font-weight:600;box-shadow:0 6px 18px rgba(31,157,116,.30), inset 0 1px 0 rgba(255,255,255,.22);
  }
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent;border-color:var(--line)}
  .btn.ghost:hover{background:rgba(255,255,255,.05)}
  .btn.icon{padding:7px 10px;font-size:14px;line-height:1}

  .menu{position:relative}
  .menu > summary{list-style:none;cursor:pointer}
  .menu > summary::-webkit-details-marker{display:none}
  .menu-panel{
    position:absolute;right:0;top:calc(100% + 8px);z-index:60;min-width:214px;
    background:var(--bg-3);border:1px solid var(--line-2);border-radius:var(--r-md);
    box-shadow:0 16px 40px rgba(0,0,0,.5);padding:6px;display:flex;flex-direction:column;gap:2px;
    animation:pop .14s ease-out;
  }
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .menu-panel button{
    display:flex;width:100%;text-align:left;border:0;background:transparent;color:var(--fg-2);
    padding:8px 10px;border-radius:var(--r-xs);cursor:pointer;font-size:12.5px;transition:.12s;
  }
  .menu-panel button:hover{background:rgba(255,255,255,.06);color:var(--fg)}

  .progress{height:2px;position:relative;overflow:hidden}
  .progress i{position:absolute;inset:0 100% 0 0;background:linear-gradient(90deg,var(--acc),var(--blue));transition:right .25s}

  .body{display:grid;grid-template-columns:344px minmax(0,1fr);min-height:0}

  /* ============================ rail ============================ */
  .rail{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:rgba(11,15,21,.55)}
  .rail-head{padding:14px 12px 10px;display:flex;flex-direction:column;gap:10px}
  .field{position:relative}
  .field svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
  .field input{
    width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:8px 10px 8px 30px;font-size:12.5px;color:var(--fg);outline:none;transition:.16s;
  }
  .field input::placeholder{color:var(--fg-3)}
  .field input:focus{border-color:rgba(74,222,159,.45);box-shadow:0 0 0 3px rgba(74,222,159,.10);background:rgba(0,0,0,.5)}
  .rail-tools{display:flex;gap:8px}
  select{
    appearance:none;cursor:pointer;outline:none;font-size:12.5px;color:var(--fg-2);
    background:rgba(0,0,0,.35) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2371808f'/></svg>") no-repeat right 10px center;
    border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 26px 7px 10px;transition:.16s;
  }
  select:hover{border-color:var(--line-2);color:var(--fg)}
  .rail-tools select{flex:1;min-width:0}
  .toggle{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r-sm);
    background:rgba(0,0,0,.35);padding:7px 10px;font-size:12.5px;color:var(--fg-3);cursor:pointer;
    transition:.16s;white-space:nowrap;
  }
  .toggle:hover{color:var(--fg-2);border-color:var(--line-2)}
  .toggle.on{color:var(--acc);border-color:rgba(74,222,159,.42);background:rgba(74,222,159,.10)}
  .toggle .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}

  .list{flex:1;overflow:auto;padding:4px 8px 12px}
  .row{
    display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--r-sm);
    cursor:pointer;border:1px solid transparent;transition:.13s;position:relative;
  }
  .row:hover{background:rgba(255,255,255,.045)}
  .row.sel{background:rgba(74,222,159,.075);border-color:rgba(74,222,159,.28)}
  .row.sel::before{
    content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:2px;border-radius:2px;
    background:linear-gradient(180deg,var(--acc),var(--acc-deep));
  }
  .row .mini{width:46px;height:46px;flex:none;border-radius:var(--r-xs);object-fit:cover;
    background:var(--bg-2);border:1px solid var(--line);display:block}
  .row.bad .mini{opacity:.35;filter:grayscale(1)}
  .row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .row .name{font-size:12.5px;font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.bad .name{color:var(--warn)}
  .row .meta{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums}
  .row .meta i{width:2px;height:2px;border-radius:50%;background:currentColor;opacity:.5}

  .rail-foot{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--fg-3);
    font-variant-numeric:tabular-nums;
  }

  /* ============================ stage ============================ */
  .stage{overflow-y:auto;min-width:0;padding:22px 26px 72px}
  .stage::-webkit-scrollbar,.list::-webkit-scrollbar{width:10px;height:10px}
  .stage::-webkit-scrollbar-thumb,.list::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.10);border-radius:8px;border:3px solid transparent;background-clip:content-box;
  }
  .stage::-webkit-scrollbar-thumb:hover,.list::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18);background-clip:content-box}

  .empty-state{max-width:560px;margin:min(9vh,90px) auto 0;text-align:center}
  .empty-icon{
    width:64px;height:64px;margin:0 auto 20px;border-radius:18px;display:grid;place-items:center;
    font-size:24px;color:var(--acc);
    background:linear-gradient(160deg,rgba(74,222,159,.16),rgba(131,169,255,.10));
    border:1px solid var(--line-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  }
  .empty-state h2{margin:0 0 8px;font-size:20px;font-weight:600;letter-spacing:-.2px}
  .empty-state p{margin:0;color:var(--fg-3);font-size:13px;line-height:1.75}
  .steps{display:flex;flex-direction:column;gap:10px;margin:26px auto 0;max-width:440px;text-align:left}
  .step{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);
    background:rgba(255,255,255,.028);border:1px solid var(--line)}
  .step b{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;flex:none;
    background:rgba(74,222,159,.14);color:var(--acc);font-size:11px;font-weight:600}
  .step span{font-size:12.5px;color:var(--fg-2);line-height:1.6}
  kbd{
    font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:5px;color:var(--fg-2);
    background:rgba(255,255,255,.07);border:1px solid var(--line-2);border-bottom-width:2px;
  }

  /* hero */
  .hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start;margin-bottom:24px}
  .hero-thumb{
    position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line-2);
    background:var(--bg-2);box-shadow:0 14px 34px rgba(0,0,0,.45);
  }
  .hero-thumb img{display:block;width:248px;max-height:330px;object-fit:contain;cursor:zoom-in;transition:.2s}
  .hero-thumb:hover img{transform:scale(1.012)}
  .hero-thumb .zoom{
    position:absolute;right:8px;bottom:8px;padding:2px 8px;border-radius:999px;font-size:10.5px;
    background:rgba(7,10,14,.72);border:1px solid var(--line-2);color:var(--fg-2);
    opacity:0;transform:translateY(4px);transition:.18s;pointer-events:none;backdrop-filter:blur(6px);
  }
  .hero-thumb:hover .zoom{opacity:1;transform:none}

  .hero-title{font-size:21px;font-weight:600;letter-spacing:-.3px;margin:2px 0 10px;word-break:break-all;line-height:1.3}
  .hero-sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--fg-3);font-size:12px;
    font-variant-numeric:tabular-nums;margin-bottom:16px}
  .badge{
    display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;
    border:1px solid var(--line-2);background:rgba(255,255,255,.04);color:var(--fg-2);
    font-variant-numeric:tabular-nums;
  }
  .badge.acc{color:var(--acc);border-color:rgba(74,222,159,.3);background:rgba(74,222,159,.08)}
  .badge.warn{color:var(--warn);border-color:rgba(244,185,94,.3);background:rgba(244,185,94,.08)}

  .hero-actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
  .hero-note{font-size:11.5px;color:var(--fg-3);line-height:1.65;margin:11px 0 0;max-width:640px}

  /* panels */
  .panel{border:1px solid var(--line);border-radius:var(--r-lg);background:rgba(255,255,255,.022);
    margin-bottom:16px;overflow:hidden}
  .panel-head{display:flex;align-items:center;gap:10px;padding:11px 16px;
    border-bottom:1px solid var(--line);background:rgba(255,255,255,.018)}
  .panel-title{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--fg-3);font-weight:600}
  .panel-note{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--fg-3);opacity:.75}
  .kv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr))}
  .kv{
    padding:13px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    display:flex;flex-direction:column;gap:5px;min-width:0;
  }
  .kv .k{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--fg-3)}
  .kv .v{font-family:var(--mono);font-size:13px;color:var(--fg);font-variant-numeric:tabular-nums;
    word-break:break-all;line-height:1.45}
  .kv.strong .v{font-size:17px;letter-spacing:-.3px;color:#fff}

  /* section */
  .sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
  .sec h3{margin:0;font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:var(--fg-2);font-weight:600}
  .sec .count{font-size:11.5px;color:var(--fg-3);font-variant-numeric:tabular-nums}
  .sec .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}
  .sec .sec-action{
    border:1px solid var(--line-2);background:transparent;color:var(--fg-3);border-radius:var(--r-xs);
    padding:3px 9px;font-size:11px;cursor:pointer;transition:.14s;
  }
  .sec .sec-action:hover{color:var(--fg);border-color:var(--line-3);background:rgba(255,255,255,.05)}

  /* lora */
  .lora-list{display:flex;flex-direction:column;gap:1px}
  .lora{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:var(--r-sm);transition:.13s}
  .lora:hover{background:rgba(255,255,255,.035)}
  .lora .idx{font-family:var(--mono);font-size:10.5px;color:var(--fg-3);width:20px;flex:none;text-align:right}
  .lora .name{flex:1;min-width:0;font-family:var(--mono);font-size:12px;color:var(--fg);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lora .name .dir{color:var(--fg-3)}
  .lora .val{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;flex:none;
    min-width:58px;text-align:right;font-weight:600}
  .lora .bar{position:relative;width:200px;height:6px;border-radius:4px;flex:none;overflow:hidden;
    background:linear-gradient(90deg, rgba(255,255,255,.035) 0 50%, rgba(255,255,255,.075) 50% 100%)}
  .lora .bar .zero{position:absolute;top:-1px;bottom:-1px;left:50%;width:1px;background:rgba(255,255,255,.32)}
  .lora .bar .fill{position:absolute;top:0;bottom:0;border-radius:3px;transition:width .3s}
  .lora .bar .fill.pos{background:linear-gradient(90deg,rgba(74,222,159,.35),var(--acc))}
  .lora .bar .fill.neg{background:linear-gradient(270deg,rgba(240,120,127,.35),var(--bad))}
  @media (max-width:1240px){.lora .bar{width:120px}}

  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-xs);
    border:1px solid var(--line-2);background:rgba(255,255,255,.035);
    font-family:var(--mono);font-size:11px;color:var(--fg-2);
  }
  .chip.by{color:var(--warn);border-color:rgba(244,185,94,.28);background:rgba(244,185,94,.07)}
  .hint{font-size:11.5px;color:var(--fg-3);margin:9px 0 0;line-height:1.65}

  /* prompt */
  .prompt{border:1px solid var(--line);border-radius:var(--r-lg);background:rgba(255,255,255,.022);
    overflow:hidden;margin-bottom:12px}
  .prompt-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .prompt-head .t{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--fg-3);font-weight:600}
  .prompt-head .len{font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums}
  .prompt-head .tools{margin-left:auto;display:flex;gap:6px}
  .icon-btn{
    width:26px;height:26px;border-radius:var(--r-xs);border:1px solid var(--line-2);
    background:transparent;color:var(--fg-3);display:grid;place-items:center;cursor:pointer;
    font-size:12px;transition:.14s;
  }
  .icon-btn:hover{color:var(--fg);background:rgba(255,255,255,.06);border-color:var(--line-3)}
  .prompt pre{
    margin:0;padding:13px 15px;white-space:pre-wrap;word-break:break-word;
    font-family:var(--mono);font-size:12.5px;line-height:1.7;color:#cfdae6;max-height:320px;overflow:auto;
  }
  .prompt pre.clip{max-height:88px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 52%,transparent)}
  .prompt pre.muted{color:var(--fg-3);font-style:italic}
  .prompt .src{padding:8px 15px;border-top:1px solid var(--line);font-family:var(--mono);
    font-size:10.5px;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* report */
  .report{border:1px solid var(--line);border-radius:var(--r-md);background:rgba(0,0,0,.28);margin:12px 0 4px;overflow:hidden}
  .report-head{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line);
    font-size:11.5px;color:var(--fg-2)}
  .report-head .dot-ok{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none;
    box-shadow:0 0 8px rgba(74,222,159,.6)}
  .report-body{max-height:236px;overflow:auto;padding:8px 13px 11px}
  .report-line{font-family:var(--mono);font-size:11.5px;line-height:1.75;color:var(--fg-2);display:flex;gap:7px}
  .report-line .mark{color:var(--acc);opacity:.85;flex:none}
  .report-line.warn{color:var(--warn)}
  .report-line.warn .mark{color:var(--warn)}

  /* table */
  .table-wrap{border:1px solid var(--line);border-radius:var(--r-lg);overflow:auto;max-height:calc(100vh - 260px)}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
  thead th{
    position:sticky;top:0;z-index:2;text-align:left;padding:9px 14px;white-space:nowrap;
    font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--fg-3);font-weight:600;
    background:rgba(16,22,30,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-2);
  }
  tbody td{padding:8px 14px;border-bottom:1px solid var(--line);color:var(--fg-2);
    font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  tbody td:first-child{color:var(--fg);font-family:var(--sans)}
  tbody tr{cursor:pointer;transition:.12s}
  tbody tr:hover td{background:rgba(255,255,255,.045)}

  /* toast / lightbox */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);padding:10px 18px;border-radius:999px;
    font-size:12.5px;background:rgba(20,28,36,.96);border:1px solid var(--line-2);color:var(--fg);
    box-shadow:0 16px 40px rgba(0,0,0,.5);opacity:0;transition:.22s;pointer-events:none;z-index:120;
    backdrop-filter:blur(10px);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .lightbox{position:fixed;inset:0;z-index:110;display:none;padding:34px;cursor:zoom-out;
    background:rgba(4,7,10,.9);backdrop-filter:blur(6px)}
  .lightbox.on{display:flex;align-items:center;justify-content:center}
  .lightbox img{max-width:100%;max-height:calc(100vh - 68px);border-radius:var(--r-md);
    border:1px solid var(--line-2);box-shadow:0 30px 90px rgba(0,0,0,.75)}
  .lightbox .cap{position:absolute;top:16px;left:0;right:0;text-align:center;
    font-family:var(--mono);font-size:11.5px;color:var(--fg-2);opacity:.9}

  .muted{color:var(--fg-3)}

  function resolveLang() {
    var q = new URLSearchParams(location.search).get("lang");
    if (q && I18N[q]) return q;
    var saved = null;
    try { saved = localStorage.getItem("comfy-png-inspector:lang"); } catch (e) {}
    if (saved && I18N[saved]) return saved;
    var nav = (navigator.language || "zh").toLowerCase();
    return nav.indexOf("zh") === 0 ? "zh" : "en";
  }
  var LANG = resolveLang();
  function t(key) {
    var table = I18N[LANG] || I18N.zh;
    var v = table[key];
    if (v === undefined) v = I18N.zh[key];
    if (typeof v === "function") return v.apply(null, Array.prototype.slice.call(arguments, 1));
    return v === undefined ? key : v;
  }

  var state = { items: [], filtered: [], selected: null, view: "detail", template: null };
  var uid = 0;

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, txt) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (txt !== undefined) d.textContent = txt;
    return d;
  }
  function html(tag, cls, markup) {
    var d = el(tag, cls);
    d.innerHTML = markup;
    return d;
  }
  function toast(msg) {
    var box = $("toast");
    box.textContent = msg; box.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { box.classList.remove("show"); }, 2200);
  }
  function fmtTime(ts) {
    if (!ts) return "";
    var d = new Date(ts), p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " +
           p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function fmtNum(v, nd) {
    if (v === undefined || v === null || v === "") return t("noData");
    if (typeof v === "number") return Number.isInteger(v) ? String(v) : v.toFixed(nd === undefined ? 2 : nd);
    return String(v);
  }
  function errorText(r) {
    if (!r || !r.error) return "";
    if (r.error.indexOf("没有 ComfyUI 元数据") >= 0 || r.error.indexOf("No ComfyUI metadata") >= 0) return t("errNoMeta");
    return r.error;
  }
  function chars(n) { return LANG === "en" ? n + " chars" : n + " 字"; }

  function fillSelect(sel, options, current) {
    sel.innerHTML = "";
    options.forEach(function (o) {
      var op = document.createElement("option");
      op.value = o[0]; op.textContent = t(o[1]);
      sel.appendChild(op);
    });
    if (current) sel.value = current;
  }
  function applyStatic() {
    document.documentElement.lang = LANG === "en" ? "en" : "zh-CN";
    document.title = t("appTitle");
    document.querySelectorAll("[data-i18n]").forEach(function (n) { n.textContent = t(n.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-ph]").forEach(function (n) { n.placeholder = t(n.getAttribute("data-i18n-ph")); });
    document.querySelectorAll("[data-i18n-title]").forEach(function (n) { n.title = t(n.getAttribute("data-i18n-title")); });
    $("langZh").classList.toggle("on", LANG === "zh");
    $("langEn").classList.toggle("on", LANG === "en");
    fillSelect($("sortSel"),
      [["mtime-desc", "sortNewest"], ["mtime-asc", "sortOldest"], ["name-asc", "sortName"], ["seed", "sortSeed"]],
      $("sortSel").value || "mtime-desc");
    fillSelect($("viewSel"), [["detail", "viewDetail"], ["sum", "viewSum"]], $("viewSel").value || "detail");
    if (state.template) {
      $("tplName").textContent = t("templateLabel", state.template.name, state.template.nodes);
      $("tplName").title = t("templateTip");
      $("tplName").style.color = "var(--acc)";
    }
    updateStat();
  }
  function setLang(next) {
    if (!I18N[next] || next === LANG) return;
    LANG = next;
    try { localStorage.setItem("comfy-png-inspector:lang", next); } catch (e) {}
    applyStatic(); renderList(); renderDetail();
  }

  function addFiles(fileList) {
    var files = Array.prototype.slice.call(fileList).filter(function (f) { return /\.png$/i.test(f.name); });
    if (!files.length) { toast(t("toastPngOnly")); return; }
    var queue = files.slice(), total = queue.length, done = 0, CONC = 6;
    function tick() {
      done++;
      $("prog").style.right = (100 - (done / total) * 100) + "%";
      $("stat").textContent = t("statParsing", done, total);
      if (done === total) {
        setTimeout(function () { $("prog").style.right = "100%"; updateStat(); }, 260);
        applyFilter();
        if (!state.selected && state.filtered.length) select(state.filtered[0].id);
      }
    }
    function next() {
      var f = queue.shift();
      if (!f) return Promise.resolve();
      return f.arrayBuffer().then(function (buf) {
        return ComfyPNG.parsePng(new Uint8Array(buf), {
          name: f.name, path: f.webkitRelativePath || f.name,
          size: f.size, mtime: f.lastModified, lang: LANG
        });
      }).then(function (rec) {
        state.items.push({ id: ++uid, name: f.name, rec: rec, url: URL.createObjectURL(f) });
        tick();
      }).catch(function (e) {
        state.items.push({ id: ++uid, name: f.name,
          rec: { name: f.name, error: String(e && e.message || e) }, url: URL.createObjectURL(f) });
        tick();
      }).then(next);
    }
    var lanes = [];
    for (var i = 0; i < Math.min(CONC, total); i++) lanes.push(next());
    Promise.all(lanes).then(function () { toast(t("toastLoaded", total)); });
  }

  async function addFromDrop(dt) {
    var items = Array.prototype.slice.call(dt.items || []);
    var entries = items.map(function (it) { return it.webkitGetAsEntry && it.webkitGetAsEntry(); }).filter(Boolean);
    if (!entries.length) { addFiles(dt.files); return; }
    var files = [];
    async function walk(entry) {
      if (entry.isFile) {
        await new Promise(function (res) { entry.file(function (f) { files.push(f); res(); }, function () { res(); }); });
      } else if (entry.isDirectory) {
        var reader = entry.createReader(), batch;
        do {
          batch = await new Promise(function (res) { reader.readEntries(res, function () { res([]); }); });
          for (var i = 0; i < batch.length; i++) await walk(batch[i]);
        } while (batch.length);
      }
    }
    for (var i = 0; i < entries.length; i++) await walk(entries[i]);
    addFiles(files);
  }

  function applyFilter() {
    var q = $("search").value.trim().toLowerCase();
    var arr = state.items.slice();
    state.view = $("viewSel").value === "sum" ? "sum" : "detail";
    if ($("btnOnlyBy").classList.contains("on")) {
      arr = arr.filter(function (it) { return it.rec.workflow && it.rec.workflow.bypassed.length; });
    }
    if (q) {
      arr = arr.filter(function (it) {
        var r = it.rec;
        if ((r.name || "").toLowerCase().indexOf(q) >= 0) return true;
        if ((r.positive || "").toLowerCase().indexOf(q) >= 0) return true;
        if ((r.negative || "").toLowerCase().indexOf(q) >= 0) return true;
        return (r.loras || []).some(function (l) { return String(l.name).toLowerCase().indexOf(q) >= 0; });
      });
    }
    var s = $("sortSel").value;
    arr.sort(function (a, b) {
      if (s === "mtime-asc") return (a.rec.mtime || 0) - (b.rec.mtime || 0);
      if (s === "name-asc") return a.name.localeCompare(b.name);
      if (s === "seed") return Number(b.rec.seed || 0) - Number(a.rec.seed || 0);
      return (b.rec.mtime || 0) - (a.rec.mtime || 0);
    });
    state.filtered = arr;
    renderList();
    if (state.view === "sum") renderDetail();
    else if (state.selected && !arr.some(function (x) { return x.id === state.selected; })) {
      state.selected = arr.length ? arr[0].id : null;
      renderDetail();
    }
  }

  function renderList() {
    var box = $("list");
    box.innerHTML = "";
    if (!state.filtered.length) {
      var empty = el("div", "empty-state");
      empty.style.margin = "34px auto 0";
      empty.appendChild(html("p", "muted", state.items.length ? t("listNoMatch") : t("listEmpty")));
      box.appendChild(empty);
      return;
    }
    var frag = document.createDocumentFragment();
    state.filtered.forEach(function (it) {
      var r = it.rec;
      var row = el("div", "row" + (it.id === state.selected ? " sel" : "") + (r.error ? " bad" : ""));
      var mini = new Image();
      mini.className = "mini"; mini.loading = "lazy"; mini.decoding = "async"; mini.alt = "";
      mini.src = it.url;
      row.appendChild(mini);
      var body = el("div", "body");
      body.appendChild(el("div", "name", it.name));
      var meta = el("div", "meta");
      meta.appendChild(el("span", null, r.error ? t("noMeta") : r.pngSize));
      if (!r.error) {
        meta.appendChild(el("i"));
        meta.appendChild(el("span", null, t("badgeLora", (r.loras || []).length)));
        meta.appendChild(el("i"));
        meta.appendChild(el("span", null, "s" + fmtNum(r.steps)));
      }
      meta.appendChild(el("i"));
      meta.appendChild(el("span", null, fmtTime(r.mtime).slice(5)));
      body.appendChild(meta);
      row.appendChild(body);
      row.onclick = function () { select(it.id); };
      frag.appendChild(row);
    });
    box.appendChild(frag);
  }

  function select(id) {
    state.selected = id;
    if (state.view === "sum") { $("viewSel").value = "detail"; state.view = "detail"; }
    renderList(); renderDetail();
    var sel = $("list").querySelector(".row.sel");
    if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: "nearest" });
    $("detail").scrollTop = 0;
  }

  function kv(label, value, opts) {
    opts = opts || {};
    var box = el("div", "kv" + (opts.strong ? " strong" : ""));
    box.appendChild(el("div", "k", label));
    var v = el("div", "v", value);
    if (opts.title) { v.title = opts.title; box.title = opts.title; }
    box.appendChild(v);
    return box;
  }
  /* "…［CLIPLoaderGGUF#4］" 这种节点标注从展示里去掉，留进 tooltip */
  function stripNode(s) {
    return typeof s === "string" ? s.replace(/\s*\[[A-Za-z0-9_]+#\d+\]\s*$/, "") : s;
  }
  function panel(title, note, cells) {
    var p = el("div", "panel");
    var head = el("div", "panel-head");
    head.appendChild(el("span", "panel-title", title));
    if (note) head.appendChild(el("span", "panel-note", note));
    p.appendChild(head);
    var grid = el("div", "kv-grid");
    cells.forEach(function (c) { grid.appendChild(c); });
    p.appendChild(grid);
    return p;
  }
  function secTitle(text, count, action) {
    var s = el("div", "sec");
    s.appendChild(el("h3", null, text));
    if (count) s.appendChild(el("span", "count", count));
    s.appendChild(el("div", "rule"));
    if (action) {
      var b = el("button", "sec-action", action.label);
      b.onclick = action.onClick;
      s.appendChild(b);
    }
    return s;
  }
  function loraRow(i, l, maxAbs) {
    var row = el("div", "lora");
    row.appendChild(el("span", "idx", String(i).padStart(2, "0")));
    var nm = el("div", "name");
    var parts = String(l.name).split("\\");
    if (parts.length > 1) {
      nm.appendChild(el("span", "dir", parts.slice(0, -1).join("\\") + "\\"));
      nm.appendChild(el("span", null, parts[parts.length - 1]));
    } else nm.textContent = l.name;
    nm.title = l.name;
    row.appendChild(nm);

    var bar = el("div", "bar");
    var v = Number(l.strength);
    if (!isNaN(v)) {
      var scale = maxAbs || 1, zero = 50, pos = 50 + (v / scale) * 50;
      bar.appendChild(el("span", "zero"));
      var f = el("span", "fill " + (v >= 0 ? "pos" : "neg"));
      if (v >= 0) { f.style.left = zero + "%"; f.style.width = (pos - zero) + "%"; }
      else { f.style.left = pos + "%"; f.style.width = (zero - pos) + "%"; }
      bar.appendChild(f);
    }
    row.appendChild(bar);

    var val = el("span", "val", isNaN(v) ? fmtNum(l.strength) : (v > 0 ? "+" : "") + v.toFixed(2));
    if (!isNaN(v)) val.style.color = v > 0 ? "var(--acc)" : (v < 0 ? "var(--bad)" : "var(--fg-3)");
    row.appendChild(val);
    return row;
  }
  function promptCard(label, text, src, generated) {
    var card = el("div", "prompt");
    var head = el("div", "prompt-head");
    head.appendChild(el("span", "t", label));
    head.appendChild(el("span", "len", generated ? "" : chars((text || "").length)));
    var tools = el("div", "tools");
    var pre = el("pre");
    if (generated) { pre.textContent = t("promptGenerated"); pre.classList.add("muted"); }
    else { pre.textContent = text || t("promptEmpty"); if (!text) pre.classList.add("muted"); }
    if ((text || "").length > 420) pre.classList.add("clip");

    if ((text || "").length > 420) {
      var tg = el("button", "icon-btn", "⌄"); tg.title = t("expand");
      tg.onclick = function () {
        pre.classList.toggle("clip");
        tg.textContent = pre.classList.contains("clip") ? "⌄" : "⌃";
      };
      tools.appendChild(tg);
    }
    var cp = el("button", "icon-btn", "⧉"); cp.title = t("copy");
    cp.onclick = function () { copy(text || ""); };
    tools.appendChild(cp);
    head.appendChild(tools);
    card.appendChild(head);
    card.appendChild(pre);
    if (src) card.appendChild(el("div", "src", src));
    return card;
  }
  function openLightbox(url, caption) {
    var lb = $("lightbox");
    lb.querySelector("img").src = url;
    lb.querySelector(".cap").textContent = caption || "";
    lb.classList.add("on");
  }
  function closeLightbox() { $("lightbox").classList.remove("on"); }
  function copy(text) {
    var done = function () { toast(t("toastCopied", text.length)); };
    var fallback = function () {
      var ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { toast(t("toastCopyFail")); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  function renderDetail() {
    var box = $("detail");
    box.innerHTML = "";
    if (state.view === "sum") { renderSum(box); return; }

    var item = null;
    for (var i = 0; i < state.items.length; i++) if (state.items[i].id === state.selected) item = state.items[i];
    if (!item) {
      var empty = el("div", "empty-state");
      empty.appendChild(el("div", "empty-icon", "▣"));
      empty.appendChild(el("h2", null, t("dropTitle")));
      empty.appendChild(el("p", null, t("dropLead")));
      var steps = el("div", "steps");
      [t("step1"), t("step2"), t("step3")].forEach(function (s, idx) {
        var step = el("div", "step");
        step.appendChild(el("b", null, String(idx + 1)));
        step.appendChild(html("span", null, s));
        steps.appendChild(step);
      });
      empty.appendChild(steps);
      empty.appendChild(html("p", "hint", t("keysHint")));
      box.appendChild(empty);
      return;
    }

    var r = item.rec;

    var hero = el("div", "hero");
    var thumbWrap = el("div", "hero-thumb");
    var img = new Image();
    img.src = item.url; img.alt = item.name; img.loading = "lazy";
    img.onclick = function () { openLightbox(item.url, item.name + "  ·  " + (r.pngSize || "") + " px"); };
    thumbWrap.appendChild(img);
    thumbWrap.appendChild(el("span", "zoom", t("zoomHint")));
    hero.appendChild(thumbWrap);

    var info = el("div");
    info.appendChild(el("h1", "hero-title", item.name));
    var sub = el("div", "hero-sub");
    sub.appendChild(el("span", null, fmtTime(r.mtime)));
    if (r.pngSize) sub.appendChild(el("span", null, r.pngSize + " px"));
    if (r.size) sub.appendChild(el("span", null, (r.size / 1024).toFixed(0) + " KB"));
    if (!r.error) {
      sub.appendChild(el("span", "badge acc", t("badgeLora", (r.loras || []).length)));
      var byCount = r.workflow ? r.workflow.bypassed.length : 0;
      if (byCount) sub.appendChild(el("span", "badge warn", t("badgeBypass", byCount)));
    }
    info.appendChild(sub);

    if (r.error) {
      var warn = el("div", "hint", "⚠ " + errorText(r));
      warn.style.color = "var(--warn)";
      info.appendChild(warn);
      hero.appendChild(info);
      box.appendChild(hero);
      if (r.a1111) box.appendChild(promptCard(t("a1111Chunk"), r.a1111, "", false));
      return;
    }

    var actions = el("div", "hero-actions");
    var b1 = el("button", "btn primary", r._workflow ? t("exportWf") : t("rebuildExport"));
    b1.onclick = function () { exportWorkflow(item); };
    actions.appendChild(b1);
    if (r._workflow) {
      var b2 = el("button", "btn", t("rebuildCompare"));
      b2.onclick = function () { composeExport(item); };
      actions.appendChild(b2);
    }
    info.appendChild(actions);
    info.appendChild(el("p", "hero-note", r._workflow ? t("hintVerbatim") : t("hintApiOnly")));
    hero.appendChild(info);
    box.appendChild(hero);

    var repSlot = el("div");
    repSlot.id = "repSlot";
    box.appendChild(repSlot);

    box.appendChild(panel(t("grpSampling"), r.samplerNode || "", [
      kv(t("kSeed"), fmtNum(r.seed), { strong: true }),
      kv(t("kSteps"), fmtNum(r.steps), { strong: true }),
      kv(t("kCfg"), fmtNum(r.cfg), { strong: true }),
      kv(t("kSampler"), (r.sampler || "—") + " · " + (r.scheduler || "—")),
      kv(t("kDenoise"), fmtNum(r.denoise))
    ]));
    box.appendChild(panel(t("grpStack"), "", [
      kv(t("kBase"), stripNode(r.baseModel) || t("noData"), { title: r.baseModel || "" }),
      kv(t("kClip"), stripNode(r.clip) || t("noData"), { title: r.clip || "" }),
      kv(t("kVae"), stripNode(r.vae) || t("noData"), { title: r.vae || "" }),
      kv(t("kLatent"), stripNode(r.latent) || t("noData"), { title: r.latent || "" }),
      kv(t("kPrefix"), r.prefix || t("noData"))
    ]));

    if (r.patches && r.patches.length) {
      box.appendChild(secTitle(t("secPatches"), t("countUnit", r.patches.length)));
      var chips = el("div", "chips");
      r.patches.forEach(function (p) {
        var pair = Object.keys(p.params || {}).map(function (k) { return k + "=" + p.params[k]; }).join("  ");
        chips.appendChild(el("span", "chip", p.class_type + "#" + p.id + "  " + pair));
      });
      box.appendChild(chips);
    }

    var loras = r.loras || [];
    box.appendChild(secTitle(t("secLoras"), t("countUnit", loras.length), loras.length ? {
      label: t("copyChain"),
      onClick: function () { copy(loras.map(function (l) { return l.name + ":" + Number(l.strength).toFixed(2); }).join("\n")); }
    } : null));
    if (loras.length) {
      var maxAbs = Math.max.apply(null, loras.map(function (l) { return Math.abs(Number(l.strength) || 0); }));
      maxAbs = Math.max(maxAbs, 1);
      var wrap = el("div", "lora-list");
      loras.forEach(function (l, idx) { wrap.appendChild(loraRow(idx + 1, l, maxAbs)); });
      box.appendChild(wrap);
    } else {
      box.appendChild(el("p", "hint", t("noLoras")));
    }

    if (r.workflow && (r.workflow.bypassed.length || r.workflow.muted.length)) {
      box.appendChild(secTitle(t("secBypass"), t("countUnit", r.workflow.bypassed.length + r.workflow.muted.length)));
      var bchips = el("div", "chips");
      r.workflow.bypassed.forEach(function (x) { bchips.appendChild(el("span", "chip by", "bypass #" + x.id + " · " + x.type)); });
      r.workflow.muted.forEach(function (x) { bchips.appendChild(el("span", "chip by", "mute #" + x.id + " · " + x.type)); });
      box.appendChild(bchips);
      box.appendChild(el("p", "hint", t("bypassNote")));
    }

    box.appendChild(secTitle(t("secPositive")));
    box.appendChild(promptCard(t("secPositive"), r.positive, r.positiveSrc, r.positiveGenerated));
    box.appendChild(secTitle(t("secNegative")));
    box.appendChild(promptCard(t("secNegative"), r.negative, r.negativeSrc, r.negativeGenerated));

    if (r.workflow && r.workflow.notes.length) {
      box.appendChild(secTitle(t("secNotes"), t("countUnit", r.workflow.notes.length)));
      r.workflow.notes.forEach(function (n) { box.appendChild(promptCard("Note#" + n.id, n.text, "", false)); });
    }

    box.appendChild(el("div", "meta-foot", t("metaChunks",
      (r.metaKeys || []).join(", "), r.nodeCount || 0, (r.workflow && r.workflow.nodeCount) || 0)));
  }

  function renderSum(box) {
    var arr = state.filtered;
    if (!arr.length) { box.appendChild(el("p", "hint", t("sumEmpty"))); return; }
    box.appendChild(secTitle(t("sumTitle"), t("sumUnit", arr.length)));
    var wrap = el("div", "table-wrap");
    var table = el("table");
    var thead = el("thead"), tr = el("tr");
    ["thName", "thTime", "thSize", "thSteps", "thCfg", "thLora", "thSeed", "thBase"].forEach(function (k) {
      tr.appendChild(el("th", null, t(k)));
    });
    thead.appendChild(tr); table.appendChild(thead);
    var tb = el("tbody");
    arr.forEach(function (it) {
      var r = it.rec, row = el("tr");
      [it.name, fmtTime(r.mtime), r.pngSize || "", fmtNum(r.steps), fmtNum(r.cfg),
       String((r.loras || []).length), fmtNum(r.seed), r.baseModel || ""].forEach(function (v) {
        row.appendChild(el("td", null, v));
      });
      row.onclick = function () { select(it.id); };
      tb.appendChild(row);
    });
    table.appendChild(tb);
    wrap.appendChild(table);
    box.appendChild(wrap);
  }

  function csvCell(v) {
    var s = v === undefined || v === null ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function download(name, text, mime) {
    var blob = new Blob([text], { type: (mime || "text/plain") + ";charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }
  function downloadBytes(name, u8, mime) {
    var blob = new Blob([u8], { type: mime || "application/octet-stream" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 8000);
  }
  function baseName(n) { return n.replace(/\.png$/i, ""); }

  function exportWorkflow(item) {
    var r = item.rec;
    if (r._workflow) {
      download(baseName(item.name) + ".workflow.json", JSON.stringify(r._workflow, null, 2), "application/json");
      toast(t("toastExportedWf"));
      return;
    }
    if (state.template) { composeExport(item); return; }
    toast(t("toastNoWorkflow"));
  }
  function composeExport(item, silent) {
    if (!state.template) { toast(t("toastNeedTemplate")); return null; }
    var out;
    try { out = ComfyPNG.composeWorkflow(state.template.json, item.rec, { lang: LANG }); }
    catch (e) { toast(t("toastRebuildFail", e && e.message || String(e))); return null; }
    if (!silent) {
      download(baseName(item.name) + ".rebuilt.json", JSON.stringify(out.workflow, null, 2), "application/json");
      toast(t("toastRebuilt", out.report.length));
    }
    showReport(out);
    return out;
  }
  function showReport(out) {
    var slot = document.getElementById("repSlot");
    if (!slot) return;
    slot.innerHTML = "";
    var box = el("div", "report");
    var head = el("div", "report-head");
    head.appendChild(el("span", "dot-ok"));
    head.appendChild(el("span", null, t("reportHead", state.template.name, out.report.length)));
    box.appendChild(head);
    var body = el("div", "report-body");
    body.appendChild(el("div", "hint", t("reportSub")));
    out.report.slice(0, 40).forEach(function (line) {
      var row = el("div", "report-line");
      row.appendChild(el("span", "mark", "›"));
      row.appendChild(el("span", null, line));
      body.appendChild(row);
    });
    if (out.report.length > 40) body.appendChild(el("div", "hint", t("reportMore", out.report.length - 40)));
    out.warnings.forEach(function (w) {
      var row = el("div", "report-line warn");
      row.appendChild(el("span", "mark", "⚠"));
      row.appendChild(el("span", null, w));
      body.appendChild(row);
    });
    if (!out.warnings.length) {
      var ok = el("div", "report-line");
      ok.appendChild(el("span", "mark", "✓"));
      ok.appendChild(el("span", null, t("reportClean")));
      body.appendChild(ok);
    }
    box.appendChild(body);
    slot.appendChild(box);
  }
  function exportZip() {
    var list = state.filtered.filter(function (it) { return it.rec._workflow; });
    if (!list.length) { toast(t("toastNoZip")); return; }
    var enc = new TextEncoder();
    var entries = list.map(function (it) {
      return { name: baseName(it.name) + ".workflow.json", data: enc.encode(JSON.stringify(it.rec._workflow, null, 2)) };
    });
    var zip = ComfyPNG.zipStore(entries);
    downloadBytes("comfy_workflows_" + Date.now() + ".zip", zip, "application/zip");
    toast(t("toastZipped", entries.length, (zip.length / 1024 / 1024).toFixed(1)));
  }
  function loadTemplate(file) {
    file.text().then(function (txt) {
      var json;
      try { json = JSON.parse(txt); } catch (e) { toast(t("toastTplInvalid")); return; }
      if (!json || !Array.isArray(json.nodes)) { toast(t("toastTplNotCanvas")); return; }
      state.template = { name: file.name, json: json, nodes: json.nodes.length };
      applyStatic(); renderDetail();
      toast(t("toastTplLoaded", file.name));
    });
  }
  function exportCsv() {
    if (!state.filtered.length) { toast(t("toastNoData")); return; }
    var cols = ["name", "mtime", "pngSize", "seed", "steps", "cfg", "sampler", "scheduler", "denoise",
                "width", "height", "baseModel", "clip", "vae", "prefix", "loraCount", "loras", "positive", "negative"];
    var lines = [cols.join(",")];
    state.filtered.forEach(function (it) {
      var r = it.rec;
      var row = {
        name: it.name, mtime: fmtTime(r.mtime), pngSize: r.pngSize, seed: r.seed, steps: r.steps,
        cfg: r.cfg, sampler: r.sampler, scheduler: r.scheduler, denoise: r.denoise,
        width: r.width, height: r.height, baseModel: r.baseModel, clip: r.clip, vae: r.vae,
        prefix: r.prefix, loraCount: (r.loras || []).length,
        loras: (r.loras || []).map(function (l) { return l.name + "=" + Number(l.strength).toFixed(2); }).join("; "),
        positive: r.positive, negative: r.negative
      };
      lines.push(cols.map(function (c) { return csvCell(row[c]); }).join(","));
    });
    download("comfy_params_" + Date.now() + ".csv", "\ufeff" + lines.join("\r\n"), "text/csv");
    toast(t("toastCsv", state.filtered.length));
  }
  function exportJson() {
    if (!state.filtered.length) { toast(t("toastNoData")); return; }
    var out = state.filtered.map(function (it) {
      var r = JSON.parse(JSON.stringify(it.rec));
      delete r._prompt; delete r._workflow;
      r.file = it.rec.path || it.name;
      return r;
    });
    download("comfy_params_" + Date.now() + ".json", JSON.stringify(out, null, 2), "application/json");
    toast(t("toastJson", out.length));
  }
  function updateStat() {
    var n = state.items.length;
    var withMeta = state.items.filter(function (x) { return !x.rec.error; }).length;
    $("stat").textContent = n ? t("statCount", n, withMeta) : t("statEmpty");
  }

  $("langZh").onclick = function () { setLang("zh"); };
  $("langEn").onclick = function () { setLang("en"); };
  $("btnFiles").onclick = function () { $("fileInput").click(); };
  $("btnDir").onclick = function () { $("dirInput").click(); };
  $("fileInput").onchange = function (e) { addFiles(e.target.files); e.target.value = ""; };
  $("dirInput").onchange = function (e) { addFiles(e.target.files); e.target.value = ""; };
  $("btnTpl").onclick = function () { $("tplInput").click(); };
  $("tplInput").onchange = function (e) {
    if (e.target.files && e.target.files[0]) loadTemplate(e.target.files[0]);
    e.target.value = "";
  };
  $("search").oninput = function () { applyFilter(); };
  $("sortSel").onchange = function () { applyFilter(); };
  $("viewSel").onchange = function () { applyFilter(); renderDetail(); };
  $("btnOnlyBy").onclick = function () { this.classList.toggle("on"); applyFilter(); };
  $("btnCsv").onclick = exportCsv;
  $("btnJson").onclick = exportJson;
  $("btnZip").onclick = exportZip;
  $("lightbox").onclick = closeLightbox;
  $("btnClear").onclick = function () {
    state.items.forEach(function (it) { try { URL.revokeObjectURL(it.url); } catch (e) {} });
    state.items = []; state.filtered = []; state.selected = null;
    renderList(); renderDetail(); updateStat();
    toast(t("toastCleared"));
  };

  document.addEventListener("click", function (e) {
    var menu = $("moreMenu");
    if (menu.open && !menu.contains(e.target)) menu.open = false;
  });
  Array.prototype.forEach.call(document.querySelectorAll(".menu-panel button"), function (b) {
    b.addEventListener("click", function () { $("moreMenu").open = false; });
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeLightbox(); $("moreMenu").open = false; return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("search").focus(); return; }
    if (document.activeElement && /input|select|textarea/i.test(document.activeElement.tagName)) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!state.filtered.length) return;
      e.preventDefault();
      var idx = state.filtered.findIndex(function (x) { return x.id === state.selected; });
      var next = e.key === "ArrowDown" ? idx + 1 : idx - 1;
      next = Math.max(0, Math.min(state.filtered.length - 1, next));
      select(state.filtered[next].id);
    }
  });

  ["dragenter", "dragover"].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); document.body.classList.add("drag"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      if (ev === "drop") e.preventDefault();
      if (ev === "dragleave" && e.relatedTarget) return;
      document.body.classList.remove("drag");
    });
  });
  document.addEventListener("drop", function (e) {
    e.preventDefault();
    if (e.dataTransfer) addFromDrop(e.dataTransfer);
  });

  applyStatic();
  renderList();
  renderDetail();
})();
</script>
</body>
</html>
